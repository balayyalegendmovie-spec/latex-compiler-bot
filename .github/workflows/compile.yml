name: Compile LaTeX and Send to Telegram

on:
  repository_dispatch:
    types: [compile_pdf]

jobs:
  build_and_deliver:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create LaTeX file
        run: |
          cat << 'EOF' > resume.tex
          ${{ github.event.client_payload.latex_code }}
          EOF

      - name: Setup Fast Tectonic Engine
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------
      # AGGRESSIVE TECTONIC CACHE 
      # This stops Tectonic from downloading packages every run
      # -----------------------------------------------------------
      - name: Cache Tectonic Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-packages-${{ hashFiles('resume.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-packages-

      - name: Compile PDF with Tectonic
        run: tectonic resume.tex
          
      - name: Send PDF to Telegram
        run: |
          if [ -f "resume.pdf" ]; then
            curl -F chat_id="${{ github.event.client_payload.chat_id }}" \
                 -F document=@resume.pdf \
                 -F caption="✅ Here is your ready-to-apply PDF resume!" \
                 https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
          else
            echo "PDF generation failed. Cannot send."
            exit 1
          fi
               
      - name: Send Source Code to Telegram
        if: always()
        run: |
          curl -F chat_id="${{ github.event.client_payload.chat_id }}" \
               -F document=@resume.tex \
               -F caption="📄 Raw LaTeX Source Code (Upload to Overleaf if you want to edit manually)" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
